name: Deploy backend al droplet

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# Un solo deploy a la vez. NO cancelar el que esté en curso (puede dejar la
# imagen Docker a medio construir).
concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: SSH deploy + health check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ambiente "production" — permite añadir reglas de protección en GitHub
    # (approvals manuales, secret scoping) sin tocar este yml.
    environment:
      name: production
      url: https://api.iamentor.tech/health
    steps:
      - name: Preparar SSH (clave dedicada al CI)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Verificación 1: el archivo es un private key OpenSSH válido.
          # Si falla aquí, el secret SSH_PRIVATE_KEY está corrupto/mal cargado.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/derived.pub 2>/tmp/keygen.err; then
            echo "::error::SSH_PRIVATE_KEY no es un private key válido"
            echo "Primeras 3 líneas del archivo (sin contenido sensible):"
            head -3 ~/.ssh/id_ed25519 | sed 's/[A-Za-z0-9+/=]\{20,\}/<REDACTED>/g'
            echo "Bytes totales:"; wc -c ~/.ssh/id_ed25519
            echo "Error de ssh-keygen:"; cat /tmp/keygen.err
            exit 1
          fi

          # Verificación 2: imprime el fingerprint público derivado.
          # Compáralo con `ssh-keygen -lf ~/.ssh/github_actions_deploy.pub` en local.
          echo "Public key fingerprint derivado del secret:"
          ssh-keygen -lf ~/.ssh/id_ed25519

          # known_hosts
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Pull + rebuild backend en el droplet
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PROJECT_PATH: ${{ secrets.DEPLOY_PROJECT_PATH }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Capturamos el SHA estable previo ANTES de aplicar el nuevo, para
          # tenerlo disponible si necesitamos rollback. El archivo
          # ~/.mentor-ia-last-stable-sha lo gestiona este propio workflow:
          # se actualiza solo cuando el health check pasa.
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail
               cd '$DEPLOY_PROJECT_PATH'
               PREV_SHA=\$(cat ~/.mentor-ia-last-stable-sha 2>/dev/null || echo '')
               echo \"── SHA estable previo: \${PREV_SHA:-<ninguno>} ──\"
               echo '── git fetch + reset al nuevo SHA ──'
               git fetch --tags origin main
               git reset --hard '$COMMIT_SHA'
               echo '── directorios de datos escribibles por el contenedor (uid app=999) ──'
               mkdir -p data/uploads
               chown -R 999:999 data/ejemplos data/uploads
               chmod -R u+rwX data/uploads
               echo '── docker compose build + up ──'
               docker compose up -d --build backend
               echo '── prune imágenes viejas ──'
               docker image prune -f"

      - name: Health check (12 intentos × 5s = 60s)
        id: health
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 https://api.iamentor.tech/health > /tmp/health.json; then
              echo "Backend healthy ✓"
              cat /tmp/health.json
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Intento $i/12 — backend aún no responde, esperando..."
            sleep 5
          done
          echo "::warning::Backend no respondió tras 60s. Se intentará rollback."
          echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 0  # No fallar aquí: damos paso al step de rollback.

      - name: Registrar nuevo SHA como estable (camino feliz)
        if: steps.health.outputs.ok == 'true'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "echo '$COMMIT_SHA' > ~/.mentor-ia-last-stable-sha"
          echo "SHA $COMMIT_SHA registrado como estable en el droplet."

      - name: Rollback automático (si health falló)
        if: steps.health.outputs.ok == 'false'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PROJECT_PATH: ${{ secrets.DEPLOY_PROJECT_PATH }}
        run: |
          set -euo pipefail
          echo "── Iniciando rollback ──"
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail
               cd '$DEPLOY_PROJECT_PATH'
               PREV_SHA=\$(cat ~/.mentor-ia-last-stable-sha 2>/dev/null || echo '')
               if [ -z \"\$PREV_SHA\" ]; then
                 echo '::error::No hay SHA estable previo guardado. Rollback imposible.'
                 exit 2
               fi
               echo \"── Revirtiendo a SHA \$PREV_SHA ──\"
               git reset --hard \"\$PREV_SHA\"
               docker compose up -d --build backend
               docker image prune -f
               echo '── Rollback aplicado, verificando health localmente ──'
               sleep 10
               for i in 1 2 3 4 5 6; do
                 if docker exec mentor-ia-backend python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\", timeout=2)' 2>/dev/null; then
                   echo 'Health interno OK tras rollback'
                   exit 0
                 fi
                 sleep 5
               done
               echo '::error::Rollback aplicado pero /health sigue fallando — intervención manual requerida'
               exit 3"

      - name: Verificación final externa
        if: steps.health.outputs.ok == 'true'
        run: |
          # Si llegamos aquí, el deploy salió bien. Esta verificación es
          # informativa: confirma que la URL pública responde después de
          # registrar el SHA estable.
          curl -fsS --max-time 10 https://api.iamentor.tech/health | tee /tmp/final.json
          echo "Deploy completo ✓"

      - name: Marcar workflow como fallido si hubo rollback
        if: steps.health.outputs.ok == 'false'
        run: |
          echo "::error::Health check inicial falló. Rollback aplicado. Servicio restaurado al SHA previo."
          echo "El job termina en fallo para que aparezca rojo en GitHub y se vea en el historial."
          exit 1

      - name: Limpiar clave SSH
        if: always()
        run: shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
