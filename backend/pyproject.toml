[project]
name = "mentor-ia-backend"
version = "0.1.0"
description = "Backend FastAPI del sistema multiagente Mentor IA"
requires-python = ">=3.11,<3.13"
license = { text = "Academic use - UTP" }
authors = [
    { name = "Miguel Lozano", email = "miguel.lozano@utp.edu.co" },
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "email-validator>=2.2",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "httpx>=0.27",
    "pypdf>=6.13.3",
    "pypdfium2>=4.30",
    "qdrant-client>=1.12",
    "openai>=1.50,<2.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "slowapi>=0.1.9,<0.2",
]

[dependency-groups]
dev = [
    "pip-audit>=2.7",
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
# Ruleset conservador para no romper código existente: pycodestyle errors (E),
# pyflakes (F), import order (I). Se puede ampliar a B/UP/SIM más adelante.
select = ["E", "F", "I"]
# E501 se gestiona por el formatter; no fallar el lint por línea larga.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Cadena de suministro: ignora paquetes publicados en los últimos 7 días para
# dar tiempo a la comunidad a detectar versiones comprometidas antes de que
# uv las resuelva (cf. ataque LiteLLM/Telnyx, marzo 2026). Equivalente Python
# al minimumReleaseAge: 1440 de pnpm en el frontend (spec-frontend.md §3.1).
[tool.uv]
exclude-newer = "7 days"
# Excepción de seguridad puntual (Dependabot #21 y #31): starlette 1.3.1
# (pub. 2026-06-12) y pypdf 6.13.3 (pub. 2026-06-17) corrigen CVEs pero caen
# dentro del cooldown global de 7 días. Se les fija un cutoff individual para
# poder instalar ya los parches sin debilitar el cooldown del resto de paquetes.
# RETIRAR estas dos entradas a partir del 2026-06-25, cuando el cooldown global
# de 7 días ya cubra ambas versiones de forma natural.
exclude-newer-package = { starlette = "2026-06-18", pypdf = "2026-06-18" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
